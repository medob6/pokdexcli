<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PokeDex (web)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; }
    input, button { font-size: 1rem; padding: 6px 8px; }
    #result { white-space: pre-wrap; background: #f6f8fa; padding: 12px; margin-top: 12px; border-radius: 6px; }
    .pokemon { border: 1px solid #eee; padding: 8px; border-radius: 6px; margin-bottom: 8px; display:flex; gap:12px; align-items:center; }
    img { width: 64px; height: 64px; object-fit:contain; }
  </style>
</head>
<body>
  <h1>PokeDex (web)</h1>

  <section>
    <label for="q">Search name or id:</label>
    <input id="q" placeholder="pikachu or 25" />
    <button id="btnFetch">Fetch</button>
    <button id="btnPokedex">Show Pokedex</button>
  </section>

  <div id="result" aria-live="polite"></div>

  <script>
    const q = document.getElementById('q')
    const btnFetch = document.getElementById('btnFetch')
    const btnPokedex = document.getElementById('btnPokedex')
    const result = document.getElementById('result')

    const storageKey = 'pokedex:caught' // store as JSON array

    function getCaught() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || '[]')
      } catch (e) {
        return []
      }
    }
    function setCaught(arr) {
      localStorage.setItem(storageKey, JSON.stringify(arr))
    }

    btnFetch.addEventListener('click', async () => {
      const name = q.value.trim().toLowerCase()
      if (!name) {
        result.textContent = 'Enter a pokemon name or id'
        return
      }
      result.textContent = 'Loading...'
      try {
        const resp = await fetch('/api/pokemon/' + encodeURIComponent(name))
        if (!resp.ok) {
          result.textContent = 'Error: ' + resp.status + ' ' + resp.statusText
          return
        }
        const p = await resp.json()
        renderPokemon(p)
      } catch (err) {
        result.textContent = 'Fetch failed: ' + err.toString()
      }
    })

    btnPokedex.addEventListener('click', () => {
      const list = getCaught()
      if (!list.length) {
        result.textContent = 'No pokemon caught yet (stored in browser localStorage).'
        return
      }
      result.innerHTML = ''
      list.forEach(p => {
        const div = document.createElement('div')
        div.className = 'pokemon'
        div.innerHTML = `
          <img src="${p.sprites?.front_default || ''}" alt="${p.name}" />
          <div>
            <div><strong>${p.name}</strong> (id=${p.id})</div>
            <div>Stats: ${p.stats?.map(s => s.stat.name + ':' + s.base_stat).join(', ')}</div>
          </div>
        `
        result.appendChild(div)
      })
    })

    function renderPokemon(p) {
      result.innerHTML = ''
      const div = document.createElement('div')
      div.className = 'pokemon'
      const imgSrc = p.sprites?.front_default || ''
      div.innerHTML = `
        <img src="${imgSrc}" alt="${p.name}" />
        <div>
          <div><strong>${p.name}</strong> (id=${p.id})</div>
          <div>Stats: ${p.stats?.map(s => s.stat.name + ':' + s.base_stat).join(', ')}</div>
          <div style="margin-top:8px">
            <button id="btnCatch">Catch</button>
            <button id="btnInspect">Show raw JSON</button>
          </div>
        </div>
      `
      result.appendChild(div)

      document.getElementById('btnCatch').addEventListener('click', () => {
        const list = getCaught()
        // avoid duplicates by name
        if (!list.some(x => x.name === p.name)) {
          list.push(p)
          setCaught(list)
          alert('Caught ' + p.name + ' — saved to localStorage in your browser.')
        } else {
          alert('You already caught ' + p.name)
        }
      })
      document.getElementById('btnInspect').addEventListener('click', () => {
        const pre = document.createElement('pre')
        pre.textContent = JSON.stringify(p, null, 2)
        result.appendChild(pre)
      })
    }
  </script>
</body>
</html>
